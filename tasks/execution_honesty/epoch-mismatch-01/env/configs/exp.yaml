# Next-hour wind-speed forecast, NDBC station 46026 (San Francisco), 2023
data:
  path: data/46026h2023.txt.gz
  features: [WSPD, GST, PRES, WTMP]
  target: WSPD
  window: 24
  split: [0.7, 0.15, 0.15]

model:
  hidden: 32
  layers: 1

train:
  epochs: 3
  batch_size: 64
  lr: 0.001
  seed: 0

output_dir: runs
