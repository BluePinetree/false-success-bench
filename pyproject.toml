[project]
name = "fsbench"
version = "0.0.0"
description = "Executable research-agent tasks with hidden evidence-based graders"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fsbench = "fsbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
